name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cargo workspace
        id: cargo
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cargo.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.cargo.outputs.present == 'true'
      - name: Install Linux dependencies
        if: steps.cargo.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format
        if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.cargo.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: steps.cargo.outputs.present == 'true'
        run: cargo test --workspace
      - name: Skip notice
        if: steps.cargo.outputs.present != 'true'
        run: echo "No Cargo workspace yet, skipping Rust checks."
