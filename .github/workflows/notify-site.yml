name: Notify website

# When a release is published, asks bhali16/quayterm-web to sync its version, downloads and
# changelog straight away (it also checks every 3 hours on its own). Needs the repository
# secret SITE_SYNC_TOKEN: a fine-grained token for bhali16/quayterm-web with
# "Contents: Read and write". Without it this workflow does nothing.
on:
  release:
    types: [published]
  # Run by hand to check the token works; the website then re-checks the latest release.
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Send quay-term-release to the website repo
        env:
          GH_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
          TAG: ${{ github.event.release.tag_name || 'manual run' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_SYNC_TOKEN is not set; the website will pick up $TAG on its next scheduled check."
            exit 0
          fi
          gh api repos/bhali16/quayterm-web/dispatches \
            -f event_type=quay-term-release \
            -f "client_payload[tag]=$TAG"
