name: Release

# Pushing a tag like v0.1.0 builds installers on all three OSes and attaches them
# to a draft GitHub Release, with a signed latest.json that installed copies read to
# find updates. Review the draft, then publish it by hand; installed copies only see
# the update once it is published. Needs the repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, args: "--target x86_64-apple-darwin", target: x86_64-apple-darwin }
          - { name: Linux, os: ubuntu-22.04, args: "", target: "" }
          - { name: Windows, os: windows-latest, args: "", target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: quay-term ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Installers are unsigned; see the README for first-run steps on macOS and Windows.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
