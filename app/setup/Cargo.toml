[package]
name = "quay-setup"
description = "Branded Windows setup for quay-term: a small Tauri app that wraps the NSIS installer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true

[features]
# Serve the bundled UI instead of the dev server. The Tauri CLI turns this on for you;
# the release workflow builds with plain cargo, so it has to be on by default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
